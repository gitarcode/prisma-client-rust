[package]
name = "prisma-cli"
version = "0.0.0"
edition = "2021"

[features]
default = ["postgresql", "mocking"]
vendored-openssl = ["dep:openssl"]
sqlite = ["prisma-client-rust-cli/sqlite", "prisma-client-rust-cli/sqlite-create-many"]
mongodb = ["prisma-client-rust-cli/mongodb"]
postgresql = ["prisma-client-rust-cli/postgresql"]
specta = ["prisma-client-rust-cli/specta"]
mocking = ["prisma-client-rust-cli/mocking"]

[dependencies]
prisma-client-rust-cli = { default-features = false, path = "../cli" }

# Quaint still uses native TLS. Vendor its Linux OpenSSL dependency so CI
# artifacts do not depend on the runner's OpenSSL installation.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }
