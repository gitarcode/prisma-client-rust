name: Compatibility binaries
on:
  push:
    branches: [gitar-0.6.11, gitar-rustls-engines]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: namespace-profile-gitar-macos
            features: postgresql,mocking
          - target: x86_64-unknown-linux-gnu
            runner: namespace-profile-gitar
            features: postgresql,mocking
          - target: aarch64-unknown-linux-gnu
            runner: namespace-profile-gitar
            features: postgresql,mocking
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.target != 'aarch64-apple-darwin'
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked
        if: matrix.target != 'aarch64-apple-darwin'
      - uses: Swatinem/rust-cache@v2
        with:
          key: compatibility-${{ matrix.target }}
      - name: Build native binary
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo build --locked --release -p prisma-cli --features ${{ matrix.features }} --target ${{ matrix.target }}
      - name: Build portable Linux binary
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo zigbuild --locked --release -p prisma-cli --features ${{ matrix.features }} --target ${{ matrix.target }}.2.28
      - name: Verify the CLI dependency tree uses rustls
        shell: bash
        run: |
          cargo tree --locked -p prisma-cli --features postgresql,mocking --target ${{ matrix.target }} -e normal,build --prefix none > /tmp/prisma-dependencies.txt
          if grep -E '^(native-tls|openssl|openssl-sys|postgres-native-tls) v' /tmp/prisma-dependencies.txt; then
            exit 1
          fi
      - name: Package binary and source revision
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          cp "target/$TARGET/release/prisma" "artifacts/prisma-cli-$TARGET"
          git rev-parse HEAD > artifacts/source-sha.txt
          cd artifacts
          zip "prisma-cli-$TARGET.zip" "prisma-cli-$TARGET" source-sha.txt
      - name: Test archive verification
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked -p prisma-client-rust-cli --no-default-features --features postgresql,mocking --lib binaries::tests
      - name: Test x86 binary on Debian 12 with an empty engine cache
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cp artifacts/prisma-cli-x86_64-unknown-linux-gnu tests/compatibility/prisma
          docker run --rm -v "$PWD/tests/compatibility:/work" debian:bookworm-slim sh -ec '
            apt-get update -qq
            apt-get install -y -qq ca-certificates rustfmt
            # Fail if the wrapper regresses to invoking OpenSSL for engine selection.
            printf "#!/bin/sh\nexit 99\n" > /work/openssl
            chmod +x /work/openssl
            export PATH=/work:$PATH
            export DATABASE_URL=postgresql://postgres@localhost:5432/postgres
            prisma generate --schema /work/schema.prisma
            test -s /work/prisma.rs
            prisma --version
            if prisma generate --schema /work/does-not-exist.prisma; then
              echo "Invalid Prisma commands must fail"
              exit 1
            fi
          '
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-cli-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/*.zip
          retention-days: 30
  driver-tests:
    runs-on: namespace-profile-gitar
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5433:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gitarcode/rust-postgres
          ref: 418e011eb5ea53fa2ca8050726df3fb6e224e60d
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tokio-postgres -p postgres -p postgres-native-tls --all-targets
      - run: cargo test -p postgres-protocol -p tokio-postgres --lib
      - run: cargo test -p tokio-postgres --test test pgbouncer_type_lookup_after_deallocate
      - run: cargo test -p tokio-postgres --test test database_error_retains_server_message
  quaint-tests:
    runs-on: namespace-profile-gitar
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Quaint revision
        id: quaint
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          with open("Cargo.toml", "rb") as source:
              revision = tomllib.load(source)["patch"]["https://github.com/Brendonovich/quaint"]["quaint"]["rev"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"rev={revision}\n")
          PYTHON
      - uses: actions/checkout@v4
        with:
          repository: gitarcode/quaint
          ref: ${{ steps.quaint.outputs.rev }}
          path: quaint-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quaint-source/tests/rustls -> target
      - run: cargo clippy --locked --manifest-path quaint-source/tests/rustls/Cargo.toml --all-targets
      - run: python3 quaint-source/tests/rustls/run.py
      - name: Verify the connector dependency tree uses rustls
        run: |
          cargo tree --locked --manifest-path quaint-source/tests/rustls/Cargo.toml -e normal,build --prefix none > /tmp/quaint-dependencies.txt
          if grep -E '^(native-tls|openssl|openssl-sys|postgres-native-tls) v' /tmp/quaint-dependencies.txt; then
            exit 1
          fi
